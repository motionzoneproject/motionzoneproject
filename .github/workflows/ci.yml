name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          # Dummy values just so Better Auth doesn't log noisy warnings/errors
          # during module initialisation. Build never actually runs auth flows.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          BETTER_AUTH_SECRET: "ci-dummy-secret-do-not-use-in-prod"
          BETTER_AUTH_URL: "http://localhost:3000"
          SITE_URL: "http://localhost:3000"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    services:
      # Samma huvudversion som produktionen.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      # Unit och integration. prod-copy kräver en produktionsbackup och körs
      # bara lokalt.
      - name: Test
        run: npx vitest run --project unit --project integration
        env:
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          BETTER_AUTH_SECRET: "ci-dummy-secret-do-not-use-in-prod-0123456789"
          BETTER_AUTH_URL: "http://localhost:3000"
          SITE_URL: "http://localhost:3000"
